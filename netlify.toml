[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

# Production equivalent of vite.config.js's dev-server proxy: without this,
# a deployed site has no idea /api/odds should hit the Netlify Function -
# it just 404s trying to serve it as a static file.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for BrowserRouter: serve index.html for any non-API, non-asset
# path so a deep link (e.g. /odds, /u/CODE) resolves to the app, which then
# renders the right route client-side. MUST come AFTER the /api/* rule above so
# it doesn't swallow function calls. (Static assets are served before redirects,
# so this doesn't shadow /assets, /favicon.svg, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CSP is scoped to what the client genuinely reaches over the network, not a
# generic template - confirmed against the actual code, not guessed:
#   - cdn.jsdelivr.net: Tesseract.js's DEFAULT source for its WASM core and
#     English language data (src/lib/ocr.js never overrides workerPath/
#     corePath/langPath) - without this the bet-slip photo scan breaks
#     silently, not loudly.
#   - site.api.espn.com / www.thesportsdb.com: src/lib/broadcastLookup.js and
#     src/lib/playerProfile.js + sportsDbPlayerSearch.js call these directly
#     from the browser, unlike every other external API in this app (which
#     goes through netlify/functions/*.js to keep the real key server-side -
#     these two happen to be keyless public endpoints).
#   - *.supabase.co (https + wss): the actual backend - REST, Storage
#     (avatars/photos/videos), and Realtime subscriptions.
#   - googletagmanager.com/google-analytics.com: src/lib/analytics.js's
#     optional GA4 - off unless VITE_GA_ID is set, but allowed here so
#     turning it on later doesn't also require a CSP change.
#   - fonts.googleapis.com/fonts.gstatic.com: the two Google Fonts the app
#     actually loads (see index.html).
#   - images.pexels.com: netlify/functions/photo.js proxies the Pexels API
#     call to keep PEXELS_API_KEY server-side, but the response is just the
#     image URL - the browser loads the actual banner straight from Pexels'
#     CDN (see SportHeroBanner.jsx / src/sw.js's own comment on this).
#     Confirmed live: shipping without this silently blocked every hero
#     banner image with no visible error except a CSP console log.
#   - *.thesportsdb.com: same shape as Pexels - player-photo.js/team-badge.js
#     proxy TheSportsDB's search API, but the photo/badge itself loads
#     client-side from their image CDN, which lives on a DIFFERENT subdomain
#     (r2.thesportsdb.com) than the API domain already in connect-src above -
#     wildcarded rather than hardcoding just r2, in case they serve from
#     another subdomain later.
# 'unsafe-inline' on style-src covers this app's extensive use of inline
# style={{}} for computed values (avatar sizing, dynamic widths) - there's no
# script-src equivalent, so scripts stay locked to specific origins only.
#
# CORS: deliberately not set anywhere, on any of the 34 functions - checked,
# not assumed (curl -X OPTIONS against a live endpoint with a foreign Origin
# header back confirmed no Access-Control-Allow-Origin comes back from
# anything here). No header means browsers only allow same-origin JS to call
# these, which is exactly right: this is a same-origin SPA, nothing here is
# meant to be called from another site's browser JS, and an explicit
# Access-Control-Allow-Origin naming just betmates.org would be a no-op
# anyway - CORS only ever gates cross-origin requests, so the app's own
# same-origin calls were never affected by its absence either way.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://images.pexels.com https://*.thesportsdb.com; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://site.api.espn.com https://www.thesportsdb.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
