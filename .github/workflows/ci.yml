name: CI

# Runs the test suite on every push to master and on every pull request,
# so a change that breaks settlement/odds logic is caught before it ships.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) - matches the glob support the test script relies on
          # (node --test "src/**/*.test.js" needs Node >= 21).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Lint runs blocking: any ESLint error OR warning fails CI. The #132
      # cleanup cleared the codebase to zero warnings (the a11y buckets fixed
      # or inline-disabled with a reason, exhaustive-deps resolved case-by-case),
      # so the ratchet is now fully closed at 0: any new warning fails CI rather
      # than just being held under a ceiling. Keep it at 0 - a genuinely
      # justified exception belongs in an inline eslint-disable with a reason,
      # not a raised ceiling.
      - name: Lint
        run: npm run lint -- --max-warnings 0
