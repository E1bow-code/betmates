name: CI

# Runs the test suite on every push to master and on every pull request,
# so a change that breaks settlement/odds logic is caught before it ships.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) - matches the glob support the test script relies on
          # (node --test "src/**/*.test.js" needs Node >= 21).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Lint runs blocking: any ESLint *error* fails CI. Warnings are held to a
      # ratchet - --max-warnings is the current master count (36), not 0,
      # because a few known warnings remain (react-hooks/exhaustive-deps,
      # no-autofocus, media-has-caption - tracked in #132). This can't turn CI
      # red today, but it stops the count creeping up: a PR that adds a new
      # warning pushes past the ceiling and fails. Lower this as the remaining
      # warnings are cleared, tightening toward 0.
      - name: Lint
        run: npm run lint -- --max-warnings 36
