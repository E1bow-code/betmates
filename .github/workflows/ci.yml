name: CI

# Runs the test suite on every push to master and on every pull request,
# so a change that breaks settlement/odds logic is caught before it ships.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) - matches the glob support the test script relies on
          # (node --test "src/**/*.test.js" needs Node >= 21).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Lint runs blocking: any ESLint error OR warning fails CI. The #132
      # cleanup cleared the codebase to zero warnings (the a11y buckets fixed
      # or inline-disabled with a reason, exhaustive-deps resolved case-by-case),
      # so the ratchet is now fully closed at 0: any new warning fails CI rather
      # than just being held under a ceiling. Keep it at 0 - a genuinely
      # justified exception belongs in an inline eslint-disable with a reason,
      # not a raised ceiling.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # Dex (data engineer) pings Discord when the build goes red - the real
      # "build red on <check>" signal, straight from CI rather than a function
      # (GitHub Actions can't read Netlify's env, so this uses a GitHub repo
      # SECRET named DISCORD_WEBHOOK_URL). No-ops if that secret is unset, and
      # never fails the job further (|| true), matching the notifyDiscord
      # helper's own no-op / never-throw contract.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set - skipping Discord notification"
            exit 0
          fi
          COMMIT="${GITHUB_SHA:0:7}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MSG="🔴 **Dex · Build** — CI failed on \`$GITHUB_REF_NAME\` ($COMMIT). $RUN_URL"
          PAYLOAD=$(jq -nc --arg c "$MSG" '{content: $c, username: "BetMates HQ", allowed_mentions: {parse: []}}')
          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" || true
